name: Deploy Engineering Book to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Mermaid browser
        # npm ci intentionally skips lifecycle scripts; Mermaid CLI still needs the
        # matching Puppeteer browser to convert source diagrams during the build.
        run: npx --no-install puppeteer browsers install chrome-headless-shell

      - name: Validate and build
        env:
          # configure-pages returns '/repository' or '' for a root/custom domain.
          # The PA-S001 renderer requires a leading and trailing slash.
          BASE_PATH: ${{ format('{0}/', steps.pages.outputs.base_path) }}
        run: npm run check

      - name: Upload static output only
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
